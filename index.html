<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculador de Días Seguros</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Calendario & Calculador de Ciclo</h1>
            <p>Control de días seguros y ventana fértil</p>
        </header>

        <!-- Historial de Fechas -->
        <section class="config-panel">
            <h2>Registrar Inicio de Período</h2>
            <form id="add-period-form">
                <div class="form-group">
                    <label for="new-period-date">Fecha de inicio:</label>
                    <input type="date" id="new-period-date" required>
                </div>
                <button type="submit" id="btn-add-period">Añadir al Historial</button>
                <!-- Mensaje de notificación -->
                <div id="mensajeNotificacion" style="display: none; padding: 10px; margin-top: 10px; border-radius: 5px; text-align: center; font-weight: bold;"></div>
            </form>

            <div class="history-container">
                <h3>Historial de Registros</h3>
                <ul id="history-list" class="history-list">
                    <!-- Las fechas guardadas se renderizan dinámicamente aquí -->
                </ul>
            </div>
        </section>

        <!-- Configuración de Cálculo -->
        <section class="config-panel">
            <h2>Parámetros del Ciclo</h2>
            <form id="cycle-form">
                <div class="form-group">
                    <label for="is-irregular">
                        <input type="checkbox" id="is-irregular" checked>
                        Ciclo Irregular
                    </label>
                </div>

                <div id="irregular-options" class="form-group">
                    <label for="min-cycle">Duración ciclo más corto (días):</label>
                    <input type="number" id="min-cycle" value="26" min="15" max="45">

                    <label for="max-cycle">Duración ciclo más largo (días):</label>
                    <input type="number" id="max-cycle" value="31" min="15" max="45">
                </div>

                <div class="form-group">
                    <label for="check-date">Consultar fecha específica:</label>
                    <input type="date" id="check-date">
                </div>

                <button type="submit" id="btn-calculate">Calcular Estado</button>
            </form>
        </section>

        <!-- Resultados -->
        <section class="results-panel">
            <h2>Estado para la Fecha Seleccionada</h2>
            <div id="status-card" class="status-card">
                <p id="status-text">Registra al menos una fecha o presiona calcular.</p>
            </div>
            
            <div class="legend">
                <span class="badge badge-safe">🟢 Bajo Riesgo</span>
                <span class="badge badge-risk">🟠 Riesgo / Fértil</span>
                <span class="badge badge-period">🔴 Período / Estimado</span>
            </div>
        </section>
    </div>

    <!-- Scripts modulares -->
    <script src="js/calculator.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
