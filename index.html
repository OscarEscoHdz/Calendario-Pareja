<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculador de Días Seguros</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Calendario & Calculador de Ciclo</h1>
            <p>Control de días seguros y ventana fértil</p>
        </header>

        <!-- Historial de Fechas -->
        <section class="config-panel">
            <h2>Registrar Inicio de Período</h2>
            <form id="add-period-form">
                <div class="form-group">
                    <label for="new-period-date">Fecha de inicio:</label>
                    <input type="date" id="new-period-date" required>
                </div>
                <button type="submit" id="btn-add-period">Añadir al Historial</button>
                <div id="mensajeNotificacion" style="display: none; padding: 10px; margin-top: 10px; border-radius: 5px; text-align: center; font-weight: bold;"></div>
            </form>

            <div class="history-container">
                <h3>Historial de Registros</h3>
                <ul id="history-list" class="history-list">
                    <!-- Registros dinámicos -->
                </ul>
            </div>
        </section>

        <!-- Configuración de Parámetros -->
        <section class="config-panel">
            <h2>Parámetros del Ciclo</h2>
            <form id="cycle-form">
                <div class="form-group">
                    <label for="is-irregular">
                        <input type="checkbox" id="is-irregular" checked>
                        Ciclo Irregular
                    </label>
                </div>

                <div id="irregular-options" class="form-group">
                    <label for="min-cycle">Duración ciclo más corto (días):</label>
                    <input type="number" id="min-cycle" value="26" min="15" max="45">

                    <label for="max-cycle">Duración ciclo más largo (días):</label>
                    <input type="number" id="max-cycle" value="31" min="15" max="45">
                </div>
            </form>
        </section>

        <!-- Vista de Calendario Visual -->
        <section class="results-panel">
            <div class="calendar-header">
                <button id="prev-month" type="button" class="btn-nav">&lt;</button>
                <h2 id="calendar-month-year">Mes Año</h2>
                <button id="next-month" type="button" class="btn-nav">&gt;</button>
            </div>

            <div class="calendar-grid">
                <div class="day-name">Dom</div>
                <div class="day-name">Lun</div>
                <div class="day-name">Mar</div>
                <div class="day-name">Mié</div>
                <div class="day-name">Jue</div>
                <div class="day-name">Vie</div>
                <div class="day-name">Sáb</div>
                <div id="calendar-days" class="calendar-days-container"></div>
            </div>

            <div class="legend">
                <span class="badge badge-safe">🟢 Seguro</span>
                <span class="badge badge-risk">🟠 Riesgo / Fértil</span>
                <span class="badge badge-period">🔴 Período / Estimado</span>
            </div>

            <!-- Detalle de la fecha seleccionada -->
            <div id="status-card" class="status-card" style="margin-top: 15px;">
                <p id="status-text">Selecciona un día del calendario para ver el detalle.</p>
            </div>
        </section>
    </div>

    <!-- Scripts modulares -->
    <script src="js/calculator.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
